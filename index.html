<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Permite mostrar acentos, letra ñ y otros caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Adapta la página a la pantalla del dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Describe brevemente el contenido de la página -->
    <meta
        name="description"
        content="Página web personal de Pamela Soria Castro, estudiante de Comercio Internacional y fan de Rauw Alejandro, Michael Jackson, las motos BMW S1000RR y Kawasaki Ninja ZX6R, y los autos Porsche y Ferrari"
    >

    <!-- Palabras clave relacionadas con el contenido -->
    <meta
        name="keywords"
        content="Pamela Soria Castro, Comercio Internacional, Rauw Alejandro, Michael Jackson, Motos BMW S1000RR, Kawasaki Ninja ZX6R, Porsche, Ferrari, Programación"
    >

    <!-- Indica quién creó la página -->
    <meta name="author" content="Pamela Soria Castro">

    <!-- Indica los derechos de autor -->
    <meta name="copyright" content="2026 - Pamela Soria Castro">

    <!-- Título de la página -->
    <title>Pamela Soria Castro - Personal Website</title>

    <!-- Conecta Bootstrap con nuestra página -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Conecta los Íconos de Bootstrap para las redes sociales -->
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Conecta nuestro archivo CSS -->
    <link rel="stylesheet" href="style.css">


    <!-- Estilos para la barra lateral y el carrito flotante -->
    <style>
        .barra-redes {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: white;
            padding: 15px 10px;
            border-radius: 10px 0 0 10px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.15);
            z-index: 1000;
        }

        .barra-redes a {
            color: #333;
            font-size: 24px;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Colores al pasar el mouse por encima de los íconos */
        .barra-redes a.face:hover { color: #1877F2; transform: scale(1.2); }
        .barra-redes a.insta:hover { color: #E1306C; transform: scale(1.2); }
        .barra-redes a.x:hover { color: #000000; transform: scale(1.2); }
        .barra-redes a.tiktok:hover { color: #000000; transform: scale(1.2); }
        .barra-redes a.youtube:hover { color: #FF0000; transform: scale(1.2); }
        .barra-redes a.whats:hover { color: #25D366; transform: scale(1.2); }

        /* Estilo para asegurar que el logo se vea bien */
        .logo-principal {
            max-width: 120px;
            height: auto;
        }

        /* Estilo para el Carrito Flotante Superior Derecho */
        .carrito {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 260px;
            z-index: 1050;
            border: 1px solid #dee2e6;
        }
    </style>

</head>

<body class="bg-light">

    <!-- CARRITO DE COMPRAS FLOTANTE (Arriba a la derecha) -->
    <div class="carrito">
        <h4 class="fs-5 mb-2">
            🛒 Carrito
            <span id="contadorCarrito" class="badge bg-primary">0</span>
        </h4>

        <!-- Aquí aparecerán los productos agregados -->
        <div id="listaCarrito">
            <p class="text-muted small mb-2">
                El carrito está vacío
            </p>
        </div>

        <!-- Aquí aparecerá el total -->
        <p class="fw-bold mb-0">
            Total: $<span id="totalCarrito">0</span>
        </p>
    </div>


    <!-- Barra lateral derecha de redes sociales -->
    <div class="barra-redes">
        <a href="https://facebook.com" target="_blank" class="face" title="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="https://instagram.com" target="_blank" class="insta" title="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="https://x.com" target="_blank" class="x" title="X"><i class="bi bi-twitter-x"></i></a>
        <a href="https://tiktok.com" target="_blank" class="tiktok" title="TikTok"><i class="bi bi-tiktok"></i></a>
        <a href="https://youtube.com" target="_blank" class="youtube" title="YouTube"><i class="bi bi-youtube"></i></a>
        <a href="https://wa.me/" target="_blank" class="whats" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
    </div>

    <!--
        NOTA: el archivo original que compartiste llegaba incompleto aquí.
        Faltan la sección de presentación, las tarjetas de productos y la
        actividad de texto/imagen que usa script.js (botonActividad,
        textoActividad, imagenActividad, productoFinanzas, botonSeleccionar,
        botonQuitar, mensajeProducto). Si me compartes esa parte del archivo,
        actualizo ahí también el nombre, la carrera y los gustos.
    -->

    <!-- Conecta nuestro archivo JS -->
    <script src="script.js"></script>

</body>

</html>
